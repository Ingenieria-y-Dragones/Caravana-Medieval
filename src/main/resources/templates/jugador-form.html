<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${jugador.id != null} ? 'Editar Jugador' : 'Crear Jugador'">Jugador</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #f9f9f9;
        }
        h1 {
            text-align: center;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }
        select, input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn-container {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        .btn {
            padding: 10px 15px;
            text-decoration: none;
            color: white;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            text-align: center;
        }
        .btn-save { background-color: #2ecc71; }
        .btn-cancel { background-color: #e74c3c; }
        .form-group {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 th:text="${jugador.id != null} ? 'Editar Jugador' : 'Crear Jugador'"></h1>
        
        <form th:action="${jugador.id != null} ? @{/jugador/update/{id}(id=${jugador.id})} : @{/jugador/save}" 
              method="post" class="form">
            
            <!-- ID oculto -->
            <input type="hidden" th:if="${jugador.id != null}" th:field="*{id}"/>

            <!-- Rol (solo para creación) -->
            <div class="form-group" th:if="${jugador.id == null}">
                <label>Rol:</label>
                <select name="rol" required class="form-control">
                    <option th:each="rol : ${roles}" 
                            th:value="${rol}"
                            th:text="${rol}"></option>
                </select>
            </div>

            <!-- Campos comunes -->
            <div class="form-group">
                <label>Nombre:</label>
                <input type="text" name="nombre" th:value="${jugador.nombre}" required/>
            </div>
            
            <div class="form-group">
                <label>Tiempo Jugado:</label>
                <input type="number" name="tiempoJugado" th:value="${jugador.tiempoJugado}" required/>
            </div>

            <!-- Campos específicos según rol -->
            <div class="form-group" th:if="${jugador.rol == T(co.edu.javeriana.caravana.model.Jugador.TipoRol).CARAVANERO}">
                <label>Caravana:</label>
                <select name="caravanaId">
                    <option th:each="caravana : ${caravanas}" 
                            th:value="${caravana.id}"
                            th:text="${caravana.nombre}"
                            th:selected="${caravana.id == jugador.caravana?.id}"></option>
                </select>
            </div>

            <div class="form-group" th:if="${jugador.rol == T(co.edu.javeriana.caravana.model.Jugador.TipoRol).COMERCIANTE}">
                <label>Ciudad:</label>
                <select name="ciudadId">
                    <option th:each="ciudad : ${ciudades}" 
                            th:value="${ciudad.id}"
                            th:text="${ciudad.nombre}"
                            th:selected="${ciudad.id == jugador.ciudad?.id}"></option>
                </select>
            </div>

            <div class="form-group" th:if="${jugador.rol == T(co.edu.javeriana.caravana.model.Jugador.TipoRol).ADMINISTRADOR}">
                <label>Sistema:</label>
                <select name="sistemaId">
                    <option th:each="sistema : ${sistemas}" 
                            th:value="${sistema.id}"
                            th:text="${sistema.nombre}"
                            th:selected="${sistema.id == jugador.sistema?.id}"></option>
                </select>
            </div>

            <!-- Botones -->
            <div class="btn-container">
                <button type="submit" class="btn btn-save">Guardar</button>
                <a th:href="@{/jugador/list}" class="btn btn-cancel">Cancelar</a>
            </div>
        </form>
    </div>
</body>
</html>
