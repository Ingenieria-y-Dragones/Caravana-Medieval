<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${jugador.id != null} ? 'Editar' : 'Crear'">Jugador</title>
</head>
<body>
    <h1 th:text="${jugador.id != null} ? 'Editar Jugador' : 'Crear Jugador'"></h1>
    
    <form th:action="${jugador.id != null} ? @{/jugador/update} : @{/jugador/save}" 
          method="post">
        
        <input type="hidden" th:field="*{id}"/>

        <!-- Tipo de jugador -->
        <div th:if="${jugador.id == null}">
            <label>Rol:</label>
            <select name="rol" required>
                <option th:each="rol : ${roles}" 
                        th:value="${rol}"
                        th:text="${rol}"></option>
            </select>
        </div>

        <!-- Campos comunes -->
        <label>Nombre:</label>
        <input type="text" name="nombre" th:value="*{nombre}" required/>
        
        <label>Tiempo Jugado:</label>
        <input type="number" name="tiempoJugado" th:value="*{tiempoJugado}" required/>

        <!-- Campos específicos según rol -->
        <div th:if="${jugador.rol == T(co.edu.javeriana.caravana.model.Jugador.TipoRol).CARAVANERO || jugador.id == null}">
            <label>Caravana:</label>
            <select name="caravanaId">
                <option th:each="caravana : ${caravanas}" 
                        th:value="${caravana.id}"
                        th:text="${caravana.nombre}"></option>
            </select>
        </div>

        <div th:if="${jugador.rol == T(co.edu.javeriana.caravana.model.Jugador.TipoRol).COMERCIANTE || jugador.id == null}">
            <label>Ciudad:</label>
            <select name="ciudadId">
                <option th:each="ciudad : ${ciudades}" 
                        th:value="${ciudad.id}"
                        th:text="${ciudad.nombre}"></option>
            </select>
        </div>

        <div th:if="${jugador.rol == T(co.edu.javeriana.caravana.model.Jugador.TipoRol).ADMINISTRADOR || jugador.id == null}">
            <label>Sistema:</label>
            <select name="sistemaId">
                <option th:each="sistema : ${sistemas}" 
                        th:value="${sistema.id}"
                        th:text="${sistema.nombre}"></option>
            </select>
        </div>

        <button type="submit">Guardar</button>
        <a th:href="@{/jugador/list}">Cancelar</a>
    </form>
</body>
</html>
