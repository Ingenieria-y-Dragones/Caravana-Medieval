<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Detalle de Jugador</title>
</head>
<body>
    <h1>Detalle de Jugador</h1>
    
    <ul>
        <li>ID: <span th:text="${jugador.id}"></span></li>
        <li>Nombre: <span th:text="${jugador.nombre}"></span></li>
        <li>Tiempo Jugado: <span th:text="${jugador.tiempoJugado}"></span></li>
        <li>Rol: <span th:text="${jugador.rol}"></span></li>

        <!-- Información específica según rol -->
        <li th:if="${jugador.rol == T(co.edu.javeriana.caravana.model.Jugador.TipoRol).CARAVANERO}">
            Caravana: <span th:text="${jugador.caravana.nombre}"></span>
        </li>
        <li th:if="${jugador.rol == T(co.edu.javeriana.caravana.model.Jugador.TipoRol).COMERCIANTE}">
            Ciudad: <span th:text="${jugador.ciudad.nombre}"></span>
        </li>
        <li th:if="${jugador.rol == T(co.edu.javeriana.caravana.model.Jugador.TipoRol).ADMINISTRADOR}">
            Sistema: <span th:text="${jugador.sistema.nombre}"></span>
        </li>
    </ul>
    
    <a th:href="@{/jugador/list}">Volver</a>
</body>
</html>
