<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Rutas de [[${ciudad.nombre}]]</title>
</head>
<body>
    <h1>Rutas de [[${ciudad.nombre}]]</h1>

    <h2>Rutas Entrantes</h2>
    <table border="1">
        <thead>
            <tr>
                <th>ID Ruta</th>
                <th>Origen</th>
                <th>Distancia (km)</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="ruta : ${ciudad.rutasEntrantes}">
                <td th:text="${ruta.id}"></td>
                <td th:text="${ruta.ciudadOrigen.nombre}"></td>
                <td th:text="${ruta.distancia}"></td>
            </tr>
        </tbody>
    </table>

    <h2>Rutas Salientes</h2>
    <table border="1">
        <thead>
            <tr>
                <th>ID Ruta</th>
                <th>Destino</th>
                <th>Distancia (km)</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="ruta : ${ciudad.rutasSalientes}">
                <td th:text="${ruta.id}"></td>
                <td th:text="${ruta.ciudadDestino.nombre}"></td>
                <td th:text="${ruta.distancia}"></td>
            </tr>
        </tbody>
    </table>

    <br>
    <a href="/ciudad/list">Volver a la lista de ciudades</a>
</body>
</html>
