<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${ciudad.id} ? 'Editar Ciudad' : 'Crear Ciudad'">Ciudad</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 400px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #f9f9f9;
        }
        h1 {
            text-align: center;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn-container {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }
        .btn {
            padding: 10px 15px;
            text-decoration: none;
            color: white;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            text-align: center;
        }
        .btn-save {
            background-color: #2ecc71;
        }
        .btn-cancel {
            background-color: #e74c3c;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 th:text="${ciudad.id} ? 'Editar Ciudad' : 'Crear Ciudad'"></h1>

        <!-- Formulario para Crear o Editar Ciudad -->
        <form th:action="${ciudad.id} ? @{/ciudad/update/{idCiudad}(idCiudad=${ciudad.id})} : @{/ciudad/save}" method="post">
            <input type="hidden" name="id" th:value="${ciudad.id}">

            <!-- Nombre de la Ciudad -->
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" th:value="${ciudad.nombre}" required>

            <!-- Impuesto de la Ciudad -->
            <label for="impuesto">Impuesto (%):</label>
            <input type="number" id="impuesto" name="impuesto" th:value="${ciudad.impuesto}" step="0.01" required>

            <!-- Botones -->
            <div class="btn-container">
                <button type="submit" class="btn btn-save">Guardar</button>
                <a href="/ciudad/list" class="btn btn-cancel">Cancelar</a>
            </div>
        </form>
    </div>

</body>
</html>
