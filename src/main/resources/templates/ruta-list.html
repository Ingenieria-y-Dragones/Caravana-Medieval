<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruta List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
        .btn {
            display: inline-block;
            padding: 5px 10px;
            text-decoration: none;
            color: white;
            border-radius: 4px;
            border: none;
            cursor: pointer;
        }
        .btn-view { background-color: #3498db; }
        .btn-edit { background-color: #f39c12; }
        .btn-delete { background-color: #e74c3c; }
        .btn-create {
            display: inline-block;
            margin-bottom: 15px;
            padding: 10px 15px;
            background-color: #2ecc71;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>Ruta List</h1>
    <a class="btn-create" th:href="@{/ruta/create}">Crear Ruta</a>
    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Daño</th>
                <th>Distancia</th>
                <th>¿Es segura?</th>
                <th>Ciudad de Origen</th>
                <th>Ciudad de Destino</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="ruta : ${rutas}">
                <td th:text="${ruta.Nombre}"></td>
                <td th:text="${ruta.Daño}"></td>
                <td th:text="${ruta.Distancia}"></td>
                <td th:text="${ruta.Segura} ? 'Sí' : 'No'"></td>
                <td th:text="${ruta.ciudadOrigen}"></td>
                <td th:text="${ruta.ciudadDestino}"></td>
                <td>
                    <a class="btn btn-view" th:href="@{/ruta/view/{id}(id=${ruta.id})}">Ver</a>
                    <a class="btn btn-edit" th:href="@{/ruta/edit/{id}(id=${ruta.id})}">Editar</a>
                    <a class="btn btn-delete" th:href="@{/ruta/delete/{id}(id=${ruta.id})}">Borrar</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
