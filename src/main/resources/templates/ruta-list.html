<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciudad List</title>
</head>
<body>
    <h1>Ciudad List</h1>
    <table>
        <thead>
            <tr>
                <th>Daño</th>
                <th>Distancia</th>
                <th>¿Es segura?</th>
                <th>Ciudad de Origen</th>
                <th>Ciudad de Destino</th>
                <th>View</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="ruta : ${rutas}">
                <td th:text="${ruta.Daño}"></td>
                <td th:text="${ruta.Distancia}"></td>
                <td th:text="${ruta.Segura} ? 'Sí' : 'No'"></td>
                <td th:text="${ruta.ciudadOrigen.Nombre}"></td>
                <td th:text="${ruta.ciudadDestino.Nombre}"></td>
                <td>
                    <a th:href="@{/ruta/view/{id}(id=${ruta.id})}">View</a>

                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
