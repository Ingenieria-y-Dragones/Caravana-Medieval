<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Ciudades</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
        .btn {
            display: inline-block;
            padding: 5px 10px;
            text-decoration: none;
            color: white;
            border-radius: 4px;
            border: none;
            cursor: pointer;
        }
        .btn-view { background-color: #3498db; }
        .btn-edit { background-color: #f39c12; }
        .btn-delete { background-color: #e74c3c; }
        .btn-create {
            display: inline-block;
            margin-bottom: 15px;
            padding: 10px 15px;
            background-color: #2ecc71;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h1>Lista de Ciudades</h1>

    <!-- Botón para agregar una nueva ciudad -->
    <a class="btn-create" href="/ciudad/create">Agregar Ciudad</a>

    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Impuesto</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="ciudad : ${ciudades}">
                <td th:text="${ciudad.nombre}"></td>
                <td th:text="${ciudad.impuesto}"></td>
                <td>
                    <a class="btn btn-view" th:href="@{/ciudad/view/{idCiudad}(idCiudad=${ciudad.id})}">Ver</a>
                    <a class="btn btn-edit" th:href="@{/ciudad/edit/{idCiudad}(idCiudad=${ciudad.id})}">Editar</a>
                    <a class="btn btn-delete" th:href="@{/ciudad/delete/{idCiudad}(idCiudad=${ciudad.id})}">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
