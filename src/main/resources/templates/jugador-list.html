<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Listado de Jugadores</title>
</head>
<body>
    <h1>Jugadores</h1>
    
    <!-- Filtro por rol -->
    <form action="#" th:action="@{/jugador/list}" method="get">
        <select name="rol">
            <option value="">Todos</option>
            <option th:each="rol : ${roles}" 
                    th:value="${rol}"
                    th:text="${rol}"></option>
        </select>
        <button type="submit">Filtrar</button>
    </form>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Rol</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="jugador : ${jugadores}">
                <td th:text="${jugador.id}"></td>
                <td th:text="${jugador.nombre}"></td>
                <td th:text="${jugador.rol}"></td>
                <td>
                    <a th:href="@{/jugador/view/{id}(id=${jugador.id})}">Ver</a>
                    <a th:href="@{/jugador/edit/{id}(id=${jugador.id})}">Editar</a>
                    <a th:href="@{/jugador/delete/{id}(id=${jugador.id})}">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
    
    <a href="/jugador/create">Crear Nuevo Jugador</a>
</body>
</html>
